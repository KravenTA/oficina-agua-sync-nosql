spring.application.name=sync-service
server.port=${SYNC_PORT:8083}

# Swagger UI muestra el contrato YAML (contract-first) en vez de uno generado desde el codigo.
# No poner springdoc.api-docs.enabled=false: eso apaga tambien Swagger UI y da 404.
springdoc.swagger-ui.url=/openapi/sync-api.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# --- Seguridad (HU-53) ---
# API key que deben enviar los clientes en la cabecera X-API-Key. Si esta vacia, el servicio rechaza
# toda solicitud a /api/* con 401. Definirla con la variable de entorno SYNC_API_KEY.
sync.api-key=${SYNC_API_KEY:}
